[project]
name = "assistant-api"
version = "0.1.0"
description = "Personal assistant API: OAuth sign-in, connector routing, Letta memory, MCP client"
requires-python = ">=3.11"
dependencies = [
    "connector-core",
    "gmail-mcp",
    "outlook-mcp",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "redis>=5.0",
    "httpx[http2]>=0.27",
    "openai>=1.60",
    "deepagents>=0.3",
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "langgraph>=0.4",
    "mcp>=1.9",
    "cryptography>=43",
    "pyjwt>=2.9",
    "itsdangerous>=2.2",
    "boto3>=1.35",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "python-docx>=1.1",
    "daytona>=0.226",
    "e2b-desktop>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv.sources]
connector-core = { path = "../../packages/connector_core", editable = true }
gmail-mcp = { path = "../../packages/gmail_mcp", editable = true }
outlook-mcp = { path = "../../packages/outlook_mcp", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
