[package]
name = "lumio"
version = "0.1.1"
description = "Lumio desktop: local computer by default, E2B fallback"
authors = ["Lumio"]
edition = "2021"

[lib]
name = "lumio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "process", "io-util", "rt-multi-thread", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
futures-util = "0.3"
dirs = "5"
hostname = "0.4"
base64 = "0.22"
enigo = "=0.1.3"
rdev = "0.5"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
