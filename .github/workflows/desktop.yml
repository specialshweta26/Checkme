name: Desktop installers

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            mac_arch: aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            mac_arch: x64
          - platform: windows-latest
            args: ""
            mac_arch: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      # In-app updates compare version numbers, so each release's version has to come from its tag.
      - name: Load the Mac signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_SIGNING_P12: ${{ secrets.MAC_SIGNING_P12 }}
          MAC_SIGNING_PASSWORD: ${{ secrets.MAC_SIGNING_PASSWORD }}
        run: apps/desktop/scripts/import-signing-cert.sh
      - name: Set the app version from the tag
        working-directory: apps/desktop/src-tauri
        shell: bash
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION.replace(/^desktop-v/, "");
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Bad version: " + version);
            const conf = JSON.parse(fs.readFileSync("tauri.conf.json", "utf8"));
            conf.version = version;
            fs.writeFileSync("tauri.conf.json", JSON.stringify(conf, null, 2) + "\n");
          '
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseName: Lumio ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
          releaseBody: |
            Lumio for Mac and Windows. This app uses this computer (files, apps, browser). The website uses a cloud computer.

            **Mac:** do not open a browser-downloaded DMG first — macOS will say Lumio is damaged (Gatekeeper quarantine). Install with Terminal from the download page, or run `xattr -cr /Applications/Lumio.app` after copying the app.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      - name: Sign Mac app and replace the DMG
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_ARCH: ${{ matrix.mac_arch }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', github.run_number) }}
        run: |
          set -euo pipefail
          APP="$(find apps/desktop/src-tauri/target -path '*/release/bundle/macos/Lumio.app' -type d | head -1 || true)"
          if [ -z "${APP}" ] || [ ! -d "${APP}" ]; then
            echo "Disk image is already uploaded. The app bundle was removed after packaging."
            exit 0
          fi
          xattr -cr "$APP" || true
          codesign --force --deep --sign "${LUMIO_MAC_IDENTITY:--}" "$APP"
          VERSION="$(python3 -c "import json; print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")"
          STAGE="$(mktemp -d)"
          ditto "$APP" "$STAGE/Lumio.app"
          xattr -cr "$STAGE/Lumio.app" || true
          DMG="Lumio_${VERSION}_${MAC_ARCH}.dmg"
          hdiutil create -volname Lumio -srcfolder "$STAGE/Lumio.app" -ov -format UDZO "$DMG"
          xattr -cr "$DMG" || true
          gh release upload "$TAG" "$DMG" --clobber
