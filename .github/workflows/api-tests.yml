name: API tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      # Same Python as apps/api/Dockerfile, so tests match production.
      - name: Install dependencies
        run: uv sync --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/pptx/package-lock.json
      - name: Install the presentation builder
        run: npm ci --prefix pptx --omit=dev
      - name: Run tests
        run: uv run --frozen python -m pytest -q
      # The Docker image installs this package with pip, so build it the same way here. A packaging problem then
      # fails the pull request instead of the Render deploy.
      - name: Build the package like the Docker image does
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist" .
