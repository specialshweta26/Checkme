[project]
name = "connector-core"
version = "0.1.0"
description = "Shared tool specs, HTTP client, text cleaning, and calendar helpers for assistant connectors"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
server = ["mcp>=1.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["connector_core"]
