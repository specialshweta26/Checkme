[project]
name = "gmail-mcp"
version = "0.1.0"
description = "Gmail + Google Calendar connector, usable in-process or as a stdio MCP server"
requires-python = ">=3.11"
dependencies = ["connector-core", "httpx>=0.27"]

[project.optional-dependencies]
server = ["mcp>=1.9"]

[project.scripts]
gmail-mcp = "gmail_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gmail_mcp"]
