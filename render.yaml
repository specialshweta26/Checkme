# Render Blueprint for the main branch.
# In the Render dashboard: New → Blueprint → this repo, branch main.
# Local development uses the `local` branch and docker compose (see README).

services:
  - type: web
    name: checkme-web
    runtime: docker
    plan: standard
    branch: main
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: API_HOSTPORT
        fromService:
          name: checkme-api
          type: pserv
          property: hostport
      - fromGroup: checkme-secrets

  - type: pserv
    name: checkme-api
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Attachments live in R2 (docs/ATTACHMENT_STORAGE.md). No disk here: a disk would turn zero-downtime deploys off.
    # healthCheckPath is web-only on Render. Private services get a TCP check, and uvicorn opens its port only after
    # startup finishes, so traffic already waits for startup.
    envVars:
      - key: FILE_STORAGE
        value: s3
      # Render ignores sync: false on an existing Blueprint, so add these three by hand in the dashboard.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: checkme-attachments
      - key: DATABASE_HOSTPORT
        fromService:
          name: checkme-postgres
          type: pserv
          property: hostport
      - key: POSTGRES_USER
        value: assistant
      - key: POSTGRES_DB
        value: assistant
      - key: POSTGRES_PASSWORD
        fromService:
          name: checkme-postgres
          type: pserv
          envVarKey: POSTGRES_PASSWORD
      - key: REDIS_URL
        fromService:
          name: checkme-redis
          type: keyvalue
          property: connectionString
      # Optional Graphiti graph. Leave NEO4J_URI empty until that database exists.
      # Aura uses the instance id as both the username and the database name.
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: 52cb8113
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: 52cb8113
      - key: GRAPHITI_TELEMETRY_ENABLED
        value: "false"
      - key: PUBLIC_WEB_URL
        fromService:
          name: checkme-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_REASONING_EFFORT
        value: none
      - key: OPENAI_SMALL_MODEL
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: DAYTONA_API_URL
        value: https://app.daytona.io/api
      - key: DAYTONA_TARGET
        value: us
      # Agent computer: E2B Desktop (live desktop stream) when E2B_API_KEY is set; Daytona is the fallback.
      - key: COMPUTER_PROVIDER
        value: e2b
      - key: E2B_API_KEY
        sync: false
      - key: E2B_SANDBOX_TIMEOUT
        value: "3600"
      # Web search order: paid APIs (Tavily first; only keyed ones run), then the computer's browser, then keyless
      # server engines. Stage time budgets: SEARCH_PAID_TIMEOUT_S, SEARCH_BROWSER_TIMEOUT_S, SEARCH_FREE_TIMEOUT_S.
      - key: SEARCH_ORDER
        value: paid,browser,free
      # Resilient browsing (docs/BROWSING.md). All optional; defaults need no account.
      # Residential/ISP proxy for the computer browser and the server fetch: http://user:pass@host:port
      - key: BROWSER_PROXY_URL
        sync: false
      # Hosted browser fallback: browserbase or steel, with its key (and BROWSERBASE_PROJECT_ID).
      - key: REMOTE_BROWSER_PROVIDER
        sync: false
      - key: BROWSERBASE_API_KEY
        sync: false
      - key: BROWSERBASE_PROJECT_ID
        sync: false
      - key: STEEL_API_KEY
        sync: false
      # Optional: higher rate limit for the r.jina.ai reader step.
      - key: JINA_API_KEY
        sync: false
      # Optional web search APIs.
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_GITHUB_AUTH_CONFIG_ID
        sync: false
      # WhatsApp channel (docs/WHATSAPP.md). Twilio when TWILIO_ACCOUNT_SID is set, else Meta (first four below).
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: WHATSAPP_PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: TWILIO_CONTENT_SID_APPROVAL
        sync: false
      - key: TWILIO_CONTENT_SID_NOTIFY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: WHATSAPP_TEMPLATE_NOTIFY
        sync: false
      - fromGroup: checkme-secrets

  - type: pserv
    name: checkme-postgres
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./deploy/postgres/Dockerfile
    dockerContext: ./deploy/postgres
    # Redeploy only when the database image changes, not on every merge to main.
    buildFilter:
      paths:
        - deploy/postgres/**
    envVars:
      - key: POSTGRES_USER
        value: assistant
      - key: POSTGRES_DB
        value: assistant
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
      - key: PORT
        value: "5432"
    disk:
      name: checkme-pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  - type: keyvalue
    name: checkme-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

envVarGroups:
  - name: checkme-secrets
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_REASONING_EFFORT
        value: none
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT
        value: common
      - key: ALLOW_PRIVATE_MCP_URLS
        value: "false"
      - key: DAYTONA_API_KEY
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_GITHUB_AUTH_CONFIG_ID
        sync: false
