# Render Blueprint for the main branch.
# In the Render dashboard: New → Blueprint → this repo, branch main.
# Local development uses the `local` branch and docker compose (see README).

services:
  - type: web
    name: checkme-web
    runtime: docker
    plan: standard
    branch: main
    dockerfilePath: ./apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: API_HOSTPORT
        fromService:
          name: checkme-api
          type: pserv
          property: hostport
      - fromGroup: checkme-secrets

  - type: pserv
    name: checkme-api
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    disk:
      name: checkme-files
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: FILE_STORAGE
        value: disk
      - key: STORAGE_DISK_PATH
        value: /var/data/attachments
      - key: DATABASE_HOSTPORT
        fromService:
          name: checkme-postgres
          type: pserv
          property: hostport
      - key: POSTGRES_USER
        value: assistant
      - key: POSTGRES_DB
        value: assistant
      - key: POSTGRES_PASSWORD
        fromService:
          name: checkme-postgres
          type: pserv
          envVarKey: POSTGRES_PASSWORD
      - key: REDIS_URL
        fromService:
          name: checkme-redis
          type: keyvalue
          property: connectionString
      - key: PUBLIC_WEB_URL
        fromService:
          name: checkme-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_REASONING_EFFORT
        value: none
      - key: DAYTONA_API_KEY
        sync: false
      - key: DAYTONA_API_URL
        value: https://app.daytona.io/api
      - key: DAYTONA_TARGET
        value: us
      # Agent computer: E2B Desktop (live desktop stream) when E2B_API_KEY is set; Daytona is the fallback.
      - key: COMPUTER_PROVIDER
        value: e2b
      - key: E2B_API_KEY
        sync: false
      - key: E2B_SANDBOX_TIMEOUT
        value: "3600"
      # Web search order: Tavily first, then the computer's browser, then keyless server engines.
      # Stage time budgets: SEARCH_FREE_TIMEOUT_S, SEARCH_BROWSER_TIMEOUT_S, SEARCH_PAID_TIMEOUT_S.
      - key: SEARCH_ORDER
        value: tavily,browser,free
      # Optional web search APIs.
      - key: TAVILY_API_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_GITHUB_AUTH_CONFIG_ID
        sync: false
      # WhatsApp channel (docs/WHATSAPP.md). Twilio when TWILIO_ACCOUNT_SID is set, else Meta (first four below).
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: WHATSAPP_PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: TWILIO_CONTENT_SID_APPROVAL
        sync: false
      - key: TWILIO_CONTENT_SID_NOTIFY
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: WHATSAPP_TEMPLATE_NOTIFY
        sync: false
      - fromGroup: checkme-secrets

  - type: pserv
    name: checkme-postgres
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./deploy/postgres/Dockerfile
    dockerContext: ./deploy/postgres
    envVars:
      - key: POSTGRES_USER
        value: assistant
      - key: POSTGRES_DB
        value: assistant
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
      - key: PORT
        value: "5432"
    disk:
      name: checkme-pgdata
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  - type: keyvalue
    name: checkme-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

envVarGroups:
  - name: checkme-secrets
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_REASONING_EFFORT
        value: none
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT
        value: common
      - key: ALLOW_PRIVATE_MCP_URLS
        value: "false"
      - key: DAYTONA_API_KEY
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: COMPOSIO_GITHUB_AUTH_CONFIG_ID
        sync: false
